    <script>
        function base64Decode(str) { try { return decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/')))); } catch (e) { try { return atob(str.replace(/-/g, '+').replace(/_/g, '/')); } catch (e2) { return ''; } } }
        function generateUniqueName(baseName, nameCounts) { const safeBaseName = String(baseName); if (!nameCounts[safeBaseName]) { nameCounts[safeBaseName] = 0; return safeBaseName; } nameCounts[safeBaseName]++; return `${safeBaseName}_${nameCounts[safeBaseName] + 1}`; }

        function tryDecodeBase64Sub(text) {
            const trimmed = text.trim();
            if (trimmed.includes('://')) return text; 
            const decoded = base64Decode(trimmed);
            if (decoded && decoded.includes('://')) return decoded;
            return text;
        }

        function parseNodeLink(line, nc) {
            if (line.startsWith('vmess://')) {
                const decoded = base64Decode(line.replace('vmess://', ''));
                if (!decoded) return null;
                try {
                    const config = JSON.parse(decoded);
                    return { name: generateUniqueName(config.ps || 'vmess', nc), type: 'vmess', server: config.add, port: parseInt(config.port) || 443, cipher: config.scy || 'auto', uuid: config.id, alterId: parseInt(config.aid) || 0, tls: config.tls === 'tls', 'skip-cert-verify': true, servername: config.sni || '', network: config.net || 'ws', 'ws-opts': { path: config.path || '/', headers: { host: config.host || config.add } } };
                } catch(e) { return null; }
            }
            if (line.startsWith('vless://') || line.startsWith('trojan://')) {
                try {
                    const url = new URL(line); const params = new URLSearchParams(url.search);
                    const type = line.split('://')[0];
                    const proxy = { 
                        name: generateUniqueName(decodeURIComponent(url.hash.replace('#', '')) || type, nc), 
                        type: type, 
                        server: url.hostname, 
                        port: parseInt(url.port) || 443, 
                        udp: true, 
                        tls: params.get('security') === 'reality' || params.get('security') === 'tls' || type === 'trojan', 
                        servername: params.get('sni') || params.get('host') || url.hostname 
                    };
                    
                    if (params.get('fp')) {
                        proxy['client-fingerprint'] = params.get('fp');
                    }

                    if (type === 'vless') {
                        proxy.uuid = url.username;
                        proxy.network = params.get('type') || 'tcp';
                        if (params.get('flow')) proxy.flow = params.get('flow');
                        if (params.get('type') === 'ws') proxy['ws-opts'] = { path: params.get('path') || '/', headers: { host: params.get('host') || url.hostname } };
                        if (params.get('security') === 'reality') proxy['reality-opts'] = { 'public-key': params.get('pbk'), 'short-id': params.get('sid') };
                    } else {
                        proxy.password = url.username;
                        proxy['skip-cert-verify'] = true;
                    }
                    return proxy;
                } catch (e) { return null; }
            }
            if (line.startsWith('hysteria2://')) {
                try {
                    const url = new URL(line); const params = new URLSearchParams(url.search);
                    return { name: generateUniqueName(decodeURIComponent(url.hash.replace('#', '')) || 'hysteria2', nc), type: 'hysteria2', server: url.hostname, port: parseInt(url.port) || 443, password: url.username || '', sni: params.get('sni') || '', 'skip-cert-verify': params.get('insecure') === '1' };
                } catch(e) { return null; }
            }
            if (line.startsWith('ss://')) {
                try {
                    const parts = line.replace('ss://', '').split('@'); if (parts.length !== 2) return null;
                    const auth = base64Decode(parts[0]); const [cipher, password] = auth.split(':');
                    const serverInfo = parts[1].split('#'); const [server, port] = serverInfo[0].split(':');
                    return { name: generateUniqueName(decodeURIComponent(serverInfo[1] || 'shadowsocks'), nc), type: 'ss', server, port: parseInt(port) || 8388, cipher, password };
                } catch (e) { return null; }
            }
            return null;
        }

        function generateClashConfig(proxies) {

            const timestamp = new Date().toLocaleString();
            return `####################################

    type: select

        }

        const outputField = document.getElementById('outputConfig');
        const inputField = document.getElementById('inputLinks');
        const nodeCountSpan = document.getElementById('nodeCount');
        const copyBtn = document.getElementById('copyButton');
        const inputWrapper = document.getElementById('inputWrapper');

        let debounceTimer;
        inputField.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(processInput, 300);
        });

        function processInput() {
            const val = inputField.value.trim();
            localStorage.setItem('subDraft_wwz_im', val);
            
            if (!val) {
                inputWrapper.classList.remove('has-text');
                outputField.value = '';
                nodeCountSpan.classList.add('hidden');
                return;
            }
            inputWrapper.classList.add('has-text');

            let processText = tryDecodeBase64Sub(val);
            const rawLines = processText.split(/\s+/).filter(l => l.includes('://'));
            const uniqueLines = [...new Set(rawLines)];

            const proxies = []; const nc = {};
            let invalidCount = 0;

            uniqueLines.forEach(line => {
                const p = parseNodeLink(line, nc);
                if (p) proxies.push(p); else invalidCount++;
            });
            
            outputField.value = proxies.length > 0 ? generateClashConfig(proxies) : '';
            
            if (proxies.length > 0 || invalidCount > 0) {
                nodeCountSpan.innerText = `✓ ${proxies.length}${invalidCount ? ` | ✕ ${invalidCount}` : ''}`;
                nodeCountSpan.classList.remove('hidden');
            } else {
                nodeCountSpan.classList.add('hidden');
            }
        }

        const copyStatus = document.getElementById('copyStatus');
        let copyFeedbackTimer;

        function showCopyStatus(message, state = 'idle') {
            copyStatus.textContent = message;
            copyStatus.dataset.state = state;
        }

        async function copyConfiguration() {
            const text = outputField.value;
            clearTimeout(copyFeedbackTimer);
            if (!text.trim()) {
                showCopyStatus('Nothing to copy yet. Add valid node links first.', 'error');
                return false;
            }

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    // Legacy fallback for browsers or contexts without the Clipboard API.
                    const previousFocus = document.activeElement;
                    const start = outputField.selectionStart;
                    const end = outputField.selectionEnd;
                    outputField.focus();
                    outputField.select();
                    const copied = document.execCommand('copy');
                    outputField.setSelectionRange(start, end);
                    if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
                    if (!copied) throw new Error('Clipboard copy command was rejected');
                }

                showCopyStatus('✓ Configuration copied to clipboard.', 'success');
                const oldText = copyBtn.dataset.originalLabel || copyBtn.innerText;
                copyBtn.dataset.originalLabel = oldText === '✓ Copied' ? 'Copy' : oldText;
                copyBtn.innerText = '✓ Copied';
                copyFeedbackTimer = setTimeout(() => {
                    copyBtn.innerText = copyBtn.dataset.originalLabel || 'Copy';
                }, 2000);
                return true;
            } catch (error) {
                showCopyStatus('Copy failed. Allow clipboard access, or select the configuration and press Ctrl+C / ⌘C.', 'error');
                return false;
            }
        }

        copyBtn.addEventListener('click', copyConfiguration);
        outputField.addEventListener('click', () => copyConfiguration());
        outputField.addEventListener('keydown', event => {
            if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
                event.preventDefault();
                copyConfiguration();
            }
        });

        document.getElementById('clearButton').addEventListener('click', () => {
            inputField.value = ''; processInput(); inputField.focus();
        });

        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-active'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-active'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault(); dropZone.classList.remove('drag-active');
            const file = e.dataTransfer.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => { inputField.value = e.target.result; processInput(); };
                reader.readAsText(file);
            }
        });

        document.getElementById('downloadButton').addEventListener('click', () => {
            const cfg = outputField.value; if (!cfg) return;
            const blob = new Blob([cfg], { type: 'text/yaml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'config.yaml'; a.click();
        });

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('subDraft_wwz_im');
            if (saved) { inputField.value = saved; processInput(); }
        });
    </script>
</body>
</html>
